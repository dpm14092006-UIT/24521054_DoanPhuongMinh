<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
  <header class="header">
    <div class="logo">Tên Của Bạn</div>
    <button onclick="toggleMenu()" aria-expanded="false" aria-controls="menu" id="menu-btn">Menu</button>
    <nav class="nav" id="menu" aria-label="Menu chính">
      <a href="#about">Giới thiệu</a>
      <a href="#projects">Dự án</a>
      <a href="#contact">Liên hệ</a>
    </nav>
  </header>

  <main id="main">
    <section id="about">
      <h1>Xin chào, tôi là Tên Của Bạn</h1>
      <p class="muted">Tôi đang học lập trình web.</p>
      <img src="avatar.jpg" alt="Ảnh chân dung của Tên Của Bạn">
    </section>

    <section id="projects">
      <h2>Dự án</h2>
      <p class="muted">Drum Kit – bộ trống chơi bằng bàn phím.</p>
    </section>

    <section id="contact">
      <h2>Liên hệ</h2>
      <a href="mailto:ban@example.com">ban@example.com</a>
    </section>
  </main>

  <script>
    const btn = document.getElementById('menu-btn');
    const menu = document.getElementById('menu');
    function toggleMenu() {
      const open = menu.classList.toggle('open');
      btn.setAttribute('aria-expanded', open);
    }
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && menu.classList.contains('open')) {
        toggleMenu();
        btn.focus();   // trả focus về nút, không bị lạc
      }
    });
  </script>
</body>
</html>
